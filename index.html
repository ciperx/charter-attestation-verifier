<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Charter attestation verifier</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         max-width: 820px; margin: 0 auto; padding: 32px 20px 72px; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; opacity: .7; }
  fieldset { border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
             border-radius: 10px; padding: 16px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
          opacity: .7; margin: 10px 0 4px; }
  input, select { width: 100%; padding: 9px 10px; border-radius: 8px; font: inherit;
                  border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
                  background: color-mix(in srgb, currentColor 4%, transparent); color: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { margin-top: 16px; padding: 10px 18px; font: inherit; font-weight: 600; border-radius: 8px;
           border: 0; background: #0a9bff; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: progress; }
  .verdict { display: none; margin: 18px 0; padding: 14px 16px; border-radius: 10px; font-weight: 600; }
  .verdict.show { display: block; }
  .ok { background: #0b3b22; color: #7df3a6; }
  .bad { background: #3d1418; color: #ff9aa4; }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 14px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid color-mix(in srgb, currentColor 12%, transparent); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; opacity: .65; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
  .match { color: #22b573; font-weight: 700; }
  .nomatch { color: #e0245e; font-weight: 700; }
  pre { background: color-mix(in srgb, currentColor 6%, transparent); padding: 12px; border-radius: 8px;
        overflow: auto; font-size: 12px; }
  .hint { font-size: 12px; opacity: .65; margin-top: 6px; }
</style>
</head>
<body>
<h1>Charter attestation verifier</h1>
<p class="sub">Give it an EAS attestation UID on Base. It reads the attestation, fetches every text
from IPFS and recomputes its sha256 — match or mismatch per text, from the chain and the bytes.</p>

<fieldset>
  <label for="uid">Attestation UID</label>
  <input id="uid" placeholder="0x… 64 hex characters" spellcheck="false" autocomplete="off">
  <div class="row">
    <div>
      <label for="network">Network</label>
      <select id="network">
        <option value="8453">Base mainnet (8453)</option>
        <option value="84532">Base Sepolia (84532)</option>
      </select>
    </div>
    <div>
      <label for="ipfs">IPFS gateway</label>
      <input id="ipfs" value="https://ipfs.io/ipfs/" spellcheck="false">
    </div>
  </div>
  <label for="rpc">RPC (optional — leave empty for the network default)</label>
  <input id="rpc" placeholder="https://mainnet.base.org" spellcheck="false">
  <button id="run">Verify</button>
  <div class="hint">Nothing is written anywhere. Reads only: one eth_call, then one GET per CID.</div>
</fieldset>

<div id="verdict" class="verdict"></div>
<div id="detail"></div>

<script type="module">
import { verifyCharter, EAS_ADDRESS, NETWORKS } from './verifier.js';

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

$('run').addEventListener('click', async () => {
  const uid = $('uid').value.trim();
  const network = Number($('network').value);
  const ipfs = $('ipfs').value.trim() || undefined;
  const rpc = $('rpc').value.trim() || undefined;

  const btn = $('run');
  btn.disabled = true;
  btn.textContent = 'Verifying…';
  $('verdict').className = 'verdict';
  $('detail').innerHTML = '';

  try {
    const out = await verifyCharter({ uid, network, rpc, ipfs });
    const v = $('verdict');
    v.className = 'verdict show ' + (out.ok ? 'ok' : 'bad');
    v.textContent = out.ok
      ? `MATCH — all ${out.texts.length} texts hash to the attested digests`
      : `NO MATCH — ${out.reason || 'verification failed'}`;

    const rows = out.texts.map((t) => `
      <tr>
        <td><strong>${esc(t.name)}</strong><br><code>${esc(t.cid)}</code></td>
        <td><code>${esc(t.expected)}</code></td>
        <td><code>${esc(t.actual || t.error || '—')}</code></td>
        <td class="${t.match ? 'match' : 'nomatch'}">${t.match ? 'match' : 'MISMATCH'}</td>
      </tr>`).join('');

    $('detail').innerHTML = `
      <table>
        <thead><tr><th>Text</th><th>Attested sha256</th><th>Computed sha256</th><th>Result</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <label>Attestation</label>
      <pre>${esc(JSON.stringify(out.attestation, null, 2))}</pre>
      <div class="hint">EAS ${esc(EAS_ADDRESS)} on ${esc((NETWORKS[network] || {}).name || network)}</div>`;
  } catch (e) {
    const v = $('verdict');
    v.className = 'verdict show bad';
    v.textContent = 'Error: ' + (e.message || e);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Verify';
  }
});

// deep link: ?uid=0x…
const q = new URLSearchParams(location.search);
if (q.get('uid')) { $('uid').value = q.get('uid'); }
if (q.get('network')) { $('network').value = q.get('network'); }
if (q.get('uid')) { $('run').click(); }
</script>
</body>
</html>
